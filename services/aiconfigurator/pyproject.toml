[project]
name = "aiconfigurator-api"
version = "0.1.0"
description = "Thin FastAPI REST wrapper over the aiconfigurator SDK (GPU sizing, performance and memory estimation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "orjson",
    "pandas",
    "pyarrow",
    # Shared ConfigIQ utilities (GPU systems catalog, observability, MCP wiring).
    "configiq",
    # aiconfigurator SDK + its Rust-compiled core, consumed as wheels published
    # by the Red Hat fork (see [tool.uv] find-links below and the Containerfile).
    # Not vendored as source into this repo. Pinned to 0.11.0: the wrapper targets
    # that SDK's API (e.g. aiconfigurator.cli.api) and the rolling wheel feed has
    # served incompatible builds — unpinned resolution once silently backtracked
    # to 0.1.1, breaking the import. Bump this in lockstep with find-links below.
    "aiconfigurator==0.11.0",
    "aiconfigurator-core==0.11.0",
    "plotext>=5.3.2,<6",
]

# Opt-in observability + MCP, both provided by the shared configiq package. Kept
# out of the base install (and enabled explicitly in the container) because otel
# tracing initializes an OTLP exporter eagerly at import; the app's guarded
# imports light up /metrics, tracing, and the MCP server only when present.
[project.optional-dependencies]
otel = ["configiq[otel]"]
mcp = ["configiq[mcp]"]

[dependency-groups]
dev = [
    "pytest",
    "numpy",
    "httpx",  # required by fastapi.testclient.TestClient
    "ruff",
]

# configiq is developed in-tree as a path dependency so local edits are picked up
# without reinstalling. The container build (context = services/) installs it
# from ./configiq-py before this service.
[tool.uv.sources]
configiq = { path = "../configiq-py", editable = true }

# The aiconfigurator SDK wheels are published as GitHub Release assets by the
# Red Hat fork, not on PyPI. Point at an immutable per-build release (not the
# rolling deploy-api-latest) so the pinned 0.11.0 wheels above always resolve;
# the rolling tag has served incompatible builds. Bump this tag together with
# the aiconfigurator/aiconfigurator-core pins in [project.dependencies].
[tool.uv]
find-links = [
    "https://github.com/redhat-performance/aiconfigurator/releases/expanded_assets/deploy-api-v0.11.0+ce6a0fff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# -ra: report reasons for all non-passing outcomes (incl. skips) in the summary,
# so the integration skip reason — which carries the exact no-perf-data 422 body
# (see _skip_if_missing_perf_data) — always shows up in CI logs.
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Blind `except Exception` is a deliberate pattern in this thin API wrapper:
# endpoint boundaries translate any error into a proper HTTP status, and
# best-effort lookups degrade gracefully rather than failing the request.
ignore = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["aiconfigurator", "aiconfigurator_core", "tools"]
